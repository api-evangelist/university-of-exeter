x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    Exeter operates a real institution-owned API - api.exeter.ac.uk, an AWS API Gateway
    deployment in eu-west-2 behind the MyExeter app - but every one of its routes is
    OAuth2/Cognito gated and returns 401, no documentation, registration path or
    specification is published anywhere on exeter.ac.uk, and there is no developer portal
    (developer.exeter.ac.uk and developers.exeter.ac.uk do not resolve). Its identity
    federation, Moodle web services and news WordPress REST API are readable but are
    upstream contracts (Shibboleth, Moodle, WordPress) rather than Exeter-authored ones,
    so no OpenAPI is saved under this institution. Its research repository ore.exeter.ac.uk
    is a Figshare tenancy sitting behind an AWS WAF challenge that returns 202 with a
    zero-length body to every client, so it is unreadable as well as vendor-contracted.
    No specification, no self-service credential, no public contract - the footprint is
    real but entirely credentialed.
