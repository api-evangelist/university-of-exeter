---
aid: university-of-exeter
name: University of Exeter
description: >-
  The University of Exeter is a public research university in Devon, United
  Kingdom, and a member of the Russell Group, ranked #169 in the QS World
  University Rankings 2025. Its public developer/API footprint is modest and
  largely institutional rather than a packaged developer program: there is no
  dedicated public developer portal. Confirmed surfaces include the Open
  Research Exeter (ORE) DSpace repository, which exposes standard DSpace
  OAI-PMH and REST interfaces for harvesting research outputs and metadata;
  federated identity via a Shibboleth/SAML Identity Provider; the MyExeter
  mobile application backend; and an official GitHub organization that
  publishes some middleware and research code (including WSO2 Micro
  Integrator artifacts).
