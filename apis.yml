aid: university-of-exeter
name: University of Exeter
x-type: university
x-category: Public Research University
description: >-
  The University of Exeter is a public research university in Devon, United Kingdom,
  and a member of the Russell Group, with campuses at Streatham and St Luke's in Exeter
  and Penryn in Cornwall. It operates no public developer portal and publishes no
  OpenAPI, and most of what appears to be an Exeter API is a vendor platform running
  under an exeter.ac.uk hostname. What Exeter genuinely operates is: a Cognito-protected
  platform API at api.exeter.ac.uk behind the MyExeter app (campus events, space
  occupancy, notifications, profile - every route returns 401 without a token and none
  are documented); its own Shibboleth SAML identity provider, published in both the UK
  Access Management Federation and InCommon/eduGAIN metadata; a Microsoft Entra ID
  tenant fronting SSO for timetabling; a Moodle VLE at ele.exeter.ac.uk that is a live
  LTI 1.3 platform and exposes Moodle's own web-service endpoint; and a public
  WordPress REST API on its news site. Its research repository Open Research Exeter is
  a Figshare tenancy, and its expert profiles are a Symplectic Elements tenancy -
  neither contract is Exeter's engineering. Exeter also maintains a hand-authored
  llms.txt with explicit guidance for agents, which is rare in this cohort.
