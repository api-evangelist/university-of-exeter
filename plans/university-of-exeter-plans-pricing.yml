description: >-
  University of Exeter is a non-commercial higher-education institution and publishes no
  commercial API pricing of any kind. Exactly one Exeter-hosted API serves data without a
  credential - the WordPress REST API on news.exeter.ac.uk. Everything else the institution
  operates (the MyExeter platform API at api.exeter.ac.uk, Moodle web services on ELE, the
  Shibboleth IdP, the Entra ID tenant) is gated by institutional affiliation or federation
  membership rather than by payment, and none of it offers a self-service signup.
notes: >-
  No published per-seat or per-call pricing and no published plans document - the two plans
  below are a derived characterisation of observed access conditions, not a published Exeter
  price list. "Free / Open" covers only news.exeter.ac.uk/wp-json/;
  "Affiliation / Credentialed" covers every other surface. Corrected 2026-09-01: the prior
  version described free "library, repository, course and open-metadata interfaces", none of
  which Exeter operates - the repository is a Figshare tenancy and no library or course API
  was found.
sources:
