plans:
- id: university-of-exeter-free-open
  name: Free / Open
  type: free
  description: >-
    The single unauthenticated Exeter-hosted API - the WordPress REST API at
    news.exeter.ac.uk/wp-json/ - is served at no charge with no registration.
  entries:
  - label: Open API Access
    name: open_api_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
- id: university-of-exeter-affiliation
  name: Affiliation / Credentialed
  type: free
  description: >-
    The MyExeter platform API (OAuth2/Cognito), Moodle web services (wstoken), the Shibboleth
    IdP and the Entra ID tenant are gated behind institutional identity or federation
    membership rather than payment. No price, and no route to a credential for an
    unaffiliated developer.
  entries:
  - label: Credentialed Access
    name: credentialed_access
    type: free
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: '0.00'
    userMultiplied: false
