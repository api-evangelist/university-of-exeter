  throttled_observed: false
limits:
- name: Undeclared
  scope: client
  metric: requests-per-minute
  limit: not published
  notes: >-
    No published limit on any Exeter-operated surface, and no rate-limit header observed on
    news.exeter.ac.uk/wp-json/, api.exeter.ac.uk or ele.exeter.ac.uk.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
