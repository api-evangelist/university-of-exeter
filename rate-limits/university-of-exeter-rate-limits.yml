description: >-
  University of Exeter publishes no rate-limit policy for any surface it operates. No 429 was
  triggered and no Retry-After, X-RateLimit-* or equivalent header was observed on any
  Exeter host during probing. The only unauthenticated Exeter-hosted API,
  news.exeter.ac.uk/wp-json/, carries WordPress core's defaults with nothing published on
  top; every other surface is credentialed, so limits (if any) are set per credential and are
  not visible externally.
notes: >-
  Derived from observation, not from a published Exeter policy - there is no rate-limit
  documentation to cite. Corrected 2026-09-01: the prior version named OAI-PMH, IIIF and
  library harvesting endpoints as throttled surfaces; Exeter operates none of those three.
