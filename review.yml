    note: Valid LinkedIn school page; 999 is LinkedIn's automated-request block.
- date: '2026-09-01'
  rating: 3
  summary: 'Re-profiled under the university pipeline with the operator axis settled before anything was
    saved. Two hidden vendor tenancies were found behind institution hostnames that a host-based verdict
    reads as institution-owned: ore.exeter.ac.uk is a CNAME to proxy-eu-01.figshare.com (its AWS WAF challenge
    page sets awsWafCookieDomainList to [''figshare.com''], and Exeter items carry Figshare group_id 58481
    with handle prefix 10779/exe), and experts.exeter.ac.uk is a CNAME to uoe.discovery.symplectic.org.
    The two DSpace surfaces the June profile recorded for ORE were inferred from platform defaults, do
    not exist, and have been removed. Four institution-operated surfaces the prior profile did not hold
    were found and added: api.exeter.ac.uk (an AWS API Gateway deployment in eu-west-2 whose routes were
    confirmed by the 401-versus-403 split and whose OAuth2 is an Exeter-owned Cognito pool), the ELE Moodle
    deployment as a live LTI 1.3 Advantage platform, the news WordPress REST API, and Exeter''s Microsoft
    Entra ID tenant. The Shibboleth IdP was verified live and confirmed in both the UK Access Management
    Federation and InCommon MDQ. A hand-authored llms.txt with an explicit Notes for agents section was
    found at www.exeter.ac.uk/llms.txt. Exeter still publishes no OpenAPI, no developer portal and no
    self-service credential.'
  endpoints:
  - url: https://api.exeter.ac.uk/user/profile
    status: 401
    note: MyExeter platform API route exists and is token-gated (routes return 401; unrouted paths return
      403).
  - url: https://api.exeter.ac.uk/spaces/get-occupancy-data
    status: 401
    note: Campus space occupancy route, institution-operated, credentialed.
  - url: https://api.exeter.ac.uk/application-settings
