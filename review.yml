  - date: '2026-06-03'
    rating: 2
    summary: >-
      The University of Exeter has no dedicated public developer portal or
      packaged API program. Confirmed live: the official website
      (www.exeter.ac.uk, 200), the MyExeter mobile backend host
      (m.exeter.ac.uk, 200), and the official GitHub organization
      Uni-of-Exeter (200, verified via GitHub API with blog www.exeter.ac.uk
      and twitter UniofExeter, 2 public repos including WSO2 MI artifacts).
      The Open Research Exeter (ORE) DSpace repository host responds but
      returns HTTP 202 with empty bodies on OAI-PMH/REST probes, indicating a
      bot-mitigation gateway, so DSpace OAI-PMH and REST endpoints are
      documented per platform defaults but could not be confirmed live. A
      Shibboleth/SAML Identity Provider exists for federated library/SSO
      access. No endpoints were fabricated; gated and unverified surfaces are
      flagged honestly.
    endpoints:
